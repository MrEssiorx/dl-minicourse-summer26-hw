defaults:
  - model: lcnn
  - metrics: asvspoof
  - datasets: asvspoof_eval
  - dataloader: example
  - transforms: asvspoof
  - _self_
inferencer:
  device_tensors: ["spectrogram", "labels"] # which tensors should be on device (ex. GPU)
  device: auto # device name or "auto"
  save_path: "asvspoof" # any name here, can be a dataset name
  seed: 1
  from_pretrained: "saved/model_best.pth" # path to the pretrained model
